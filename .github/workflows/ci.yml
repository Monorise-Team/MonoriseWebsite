name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Wynik widać w pull requeście; osoba scalająca sprawdza, że jest zielony (ADR-0086).
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Instalacja zależności
        run: pnpm install --frozen-lockfile
      - name: Formatowanie, lint, typy i build
        run: pnpm run check
