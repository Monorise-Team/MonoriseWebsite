name: Sync dev

# Po każdym wypchnięciu na prod (scalony pull request dev -> prod albo pilna poprawka) automat scala prod
# z powrotem do dev przez pull request, żeby dev miał zawsze to, co jest na produkcji (ADR-0086).

on:
  push:
    branches: [prod]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: Monorise-Team/.github/.github/workflows/sync-dev.yml@main
